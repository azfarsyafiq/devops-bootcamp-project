---
- name: Install pip + Python docker SDK + awscli
  block:
    - name: Install python3-pip
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: true

    - name: Install Python docker SDK + awscli
      ansible.builtin.pip:
        name:
          - docker
          - awscli
        state: present
        extra_args: --break-system-packages
  vars:
    ansible_python_interpreter: /usr/bin/python3
  # awscli tidak lagi wujud sebagai pakej apt pada Ubuntu 24.04,
  # jadi dipasang melalui pip.

- name: Clone project repository
  ansible.builtin.git:
    repo: https://github.com/azfarsyafiq/devops-bootcamp-final-project.git
    dest: /opt/ship
    version: main
    force: true
  # force:true -> tarik selalu versi terkini, selamat untuk run berulang

- name: Render Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: /opt/ship/app/Dockerfile

- name: Render nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/ship/app/nginx.conf

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/ship/app/docker-compose.yml

- name: Get ECR login password
  ansible.builtin.command:
    cmd: aws ecr get-login-password --region {{ aws_region }}
  register: ecr_login
  changed_when: false

- name: Login to private ECR
  community.docker.docker_login:
    registry_url: "{{ ecr_registry }}"
    username: AWS
    password: "{{ ecr_login.stdout }}"

- name: Build image dan tolak ke private ECR
  community.docker.docker_image:
    name: "{{ ecr_image }}"
    source: build
    build:
      path: /opt/ship/app
      pull: true
    push: true
    force_source: true
    state: present

- name: Run container guna docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/ship/app
    state: present
  vars:
    # required by community.docker.docker_compose_v2
    ansible_python_interpreter: /usr/bin/python3