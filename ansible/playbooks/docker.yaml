- name: Install Docker
  hosts: web_server
  gather_facts: true
  become: true
  connection: community.aws.aws_ssm
  vars:
    docker_users:
      - ubuntu
    docker_install_compose_plugin: true
    ansible_aws_ssm_region: ap-southeast-1
    ansible_aws_ssm_bucket_name: devops-bootcamp-ssm-session-bucket-azfarsyafiq
  roles:
    - geerlingguy.docker