name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Render README to HTML
        run: |
          mkdir -p _site
          pandoc readme.md -s -o _site/index.html \
            --metadata title="DevOps Bootcamp Final Project" \
            --metadata lang=en
      - name: Enable Mermaid on the page
        run: |
          cat >> _site/index.html <<'EOF'
          <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
            document.querySelectorAll('pre.mermaid > code, pre.sourceCode.mermaid > code').forEach(function (c) {
              var pre = c.parentElement;
              pre.textContent = c.textContent;
            });
            mermaid.initialize({ startOnLoad: true });
          </script>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5